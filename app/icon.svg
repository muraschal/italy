<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06181f"/>
      <stop offset="100%" stop-color="#0d2b35"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="108"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Trikolore als Grundmotiv, gedämpft damit die Strasse trägt -->
    <g opacity="0.5">
      <rect x="0"   y="0" width="171" height="512" fill="#008C45"/>
      <rect x="171" y="0" width="170" height="512" fill="#F4F5F0"/>
      <rect x="341" y="0" width="171" height="512" fill="#CD212A"/>
    </g>
    <rect width="512" height="512" fill="#06181f" opacity="0.42"/>

    <!-- Alpenkette -->
    <g fill="#06181f" fill-opacity="0.4" stroke="#F4F5F0" stroke-width="10" stroke-linejoin="round">
      <path d="M96,282 L168,150 L240,282 Z"/>
      <path d="M232,282 L318,122 L404,282 Z"/>
    </g>
    <path d="M292,170 L318,122 L344,170 L326,160 L310,172 Z" fill="#F4F5F0"/>

    <!-- Passstrasse -->
    <path d="M120,424 C196,424 176,368 250,368 C324,368 300,314 380,314"
          fill="none" stroke="#F4F5F0" stroke-width="26" stroke-linecap="round"/>
    <path d="M120,424 C196,424 176,368 250,368 C324,368 300,314 380,314"
          fill="none" stroke="#06181f" stroke-width="20" stroke-linecap="round"/>
    <path d="M120,424 C196,424 176,368 250,368 C324,368 300,314 380,314"
          fill="none" stroke="#F4F5F0" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="14 22" opacity="0.9"/>
  </g>
</svg>
