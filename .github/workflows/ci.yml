name: CI

# Deployt nicht — das übernimmt die Vercel-Git-Integration.
# Dieser Workflow prüft nur, damit Fehler im PR auffallen und nicht erst im Vercel-Build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Gleiche Major wie die Runtime des Vercel-Projekts.
          node-version: 24
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  routes:
    name: Routen-JSON gegen trip.ts prüfen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      # Fängt den Fall ab, dass in trip.ts eine Etappe ergänzt wurde, aber
      # `npm run fetch-routes` vergessen ging — die Karte würde dann still auf
      # eine Luftlinie zurückfallen statt die echte Strecke zu zeigen.
      - name: Jede Auto-/Fussetappe hat einen Streckenverlauf
        run: npm run check-routes
