<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06181f"/>
      <stop offset="100%" stop-color="#0d2b35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9b795"/>
      <stop offset="100%" stop-color="#e8845c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#46c4bb"/>
      <stop offset="100%" stop-color="#2c9a92"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Alpenkette -->
  <g fill="url(#accent)" fill-opacity="0.13" stroke="url(#accent)" stroke-width="9" stroke-linejoin="round">
    <path d="M96,286 L168,154 L240,286 Z"/>
    <path d="M232,286 L318,126 L404,286 Z"/>
  </g>
  <!-- Schneekappe auf dem Hauptgipfel -->
  <path d="M292,174 L318,126 L344,174 L326,164 L310,176 Z" fill="url(#accent)" fill-opacity="0.8"/>

  <!-- See -->
  <path d="M72,300 H440 v22 a368,26 0 0 1 -368,0 Z" fill="url(#water)" fill-opacity="0.28"/>
  <path d="M96,330 q40,-12 80,0 t80,0 t80,0 t56,0" fill="none" stroke="url(#water)" stroke-width="7"
        stroke-linecap="round" opacity="0.55"/>

  <!-- Passstrasse -->
  <path d="M128,418 C196,418 176,368 244,368 C312,368 292,322 360,322"
        fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round"/>
  <path d="M128,418 C196,418 176,368 244,368 C312,368 292,322 360,322"
        fill="none" stroke="#06181f" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="16 20" opacity="0.85"/>
</svg>
